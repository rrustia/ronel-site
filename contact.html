<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Information | Ronel Rustia</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="header">
        <h1>Contact Information</h1>
        <p><a href="index.html">Back to resume</a></p>
    </div>

    <main class="container">
        <section class="section">
            <h2>Get in touch</h2>
            <p><strong>Email:</strong> <a href="mailto:fedstats@yahoo.com">fedstats@yahoo.com</a></p>
            <p><strong>Phone:</strong> <a href="tel:+14085689796">+1 (408) 568‑9796</a></p>
            <p><strong>LinkedIn:</strong> <a href="https://www.linkedin.com/in/ronel-rustia-7b9348255/" target="_blank" rel="noopener noreferrer">LinkedIn Profile</a></p>
        </section>

        <section class="section">
            <h2>Send a message</h2>
            <p id="form-status" role="status" aria-live="polite" hidden>Your message has been sent. Thank you for reaching out.</p>
            <form name="contact" method="POST" action="/contact.html?success=true" data-netlify="true" netlify-honeypot="bot-field" class="contact-form">
                <input type="hidden" name="form-name" value="contact">
                <p hidden>
                    <label>Leave this field empty: <input name="bot-field"></label>
                </p>
                <label for="name">Name</label>
                <input id="name" name="name" type="text" autocomplete="name" required>

                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <button type="submit">Send message</button>
            </form>
        </section>
    </main>

    <script>
        if (new URLSearchParams(window.location.search).get("success") === "true") {
            document.getElementById("form-status").hidden = false;
        }
    </script>
</body>
</html>
